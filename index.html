<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="課序：家教排課單檔互動作業展示版。以虛構資料體驗老師與家長協調課表。"><title>課序｜家教排課・作業展示版</title>
<style>

r:#8a8371}.lesson.draft{border:1px dashed var(--border)}.lesson.cancelled{text-decoration:line-through;color:var(--sub);border-color:#aaa}.lesson.changed{border-color:#9a3a28;background:#f7e5dc}.tag{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11px;background:#ede8df;color:var(--sub)}.discussion .tag{background:#f3d9a7;color:var(--gold)}.leave .tag{background:#e2d9ef;color:var(--purple)}.legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0;color:var(--sub);font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:var(--surface);padding:22px;border:1px solid var(--line);border-radius:16px}.card p{margin:8px 0;color:var(--sub)}.card .actions{margin-top:16px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.empty{padding:35px;color:var(--sub);text-align:center}.list{display:grid;gap:12px}.row{padding:16px;background:var(--card);border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.panel{position:fixed;right:16px;top:16px;bottom:16px;width:420px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 32px #3d39292b;overflow:auto;z-index:10}.panel[hidden]{display:none}.panel header{margin-bottom:20px}.panel .row{width:100%;text-align:left;border:1px solid var(--line);margin:8px 0}.panel h3{margin:20px 0 10px}dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;width:620px;max-width:calc(100vw - 24px);max-height:90vh;padding:26px;box-shadow:0 12px 48px #3d392929}dialog::backdrop{background:#3d392945}dialog header{margin-bottom:18px}dialog label{display:block;font-size:13px;color:var(--sub);margin-top:14px}input,select,textarea{display:block;width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);margin-top:5px;min-height:42px}textarea{min-height:76px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.error{color:#9a3a28;background:#f7e5dc;padding:12px;border-radius:8px;margin-top:12px}.error:empty{display:none}.note{background:var(--card);border-radius:12px;padding:14px;margin:14px 0}.note p+p{margin-top:8px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.slots button{padding:8px;font-size:13px}.slots button[aria-pressed=true]{background:var(--primary);color:white}.history{padding-left:18px;color:var(--sub);font-size:13px}.history li{margin-bottom:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);background:var(--ink);color:white;border-radius:12px;padding:12px 20px;z-index:30;box-shadow:0 6px 24px #0002}.toast:empty{display:none}.help{margin-top:22px;font-size:13px;color:var(--sub)}.mobile-list{display:none}footer{margin-top:30px;border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--sub)}
@media(min-width:1400px){main{padding:40px 50px}.day{min-height:140px}}@media(max-width:1000px){.shell{grid-template-columns:170px minmax(0,1fr)}aside{padding:24px 14px}main{padding:26px 20px}.cards{grid-template-columns:repeat(2,1fr)}.day{padding:5px;min-height:112px}.lesson{padding:5px 3px}header{align-items:flex-start;flex-wrap:wrap}}@media(max-width:700px){.shell{display:block}aside{padding:12px 16px;gap:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:24px}.brand small{display:inline;font-size:11px;margin-left:10px}.nav{display:flex}.nav button{flex:1;text-align:center}.aside-bottom{display:flex;flex-wrap:wrap}.aside-bottom button{font-size:12px;padding:5px 10px;min-height:34px}.aside-bottom small{display:none}main{padding:22px 16px}h1{font-size:24px}header{gap:12px;margin-bottom:18px}.role{width:100%}.role button{flex:1}.metrics{gap:8px}.metric strong{font-size:24px}.summary{gap:10px}.summary button{padding:14px}.summary strong{font-size:15px}.summary .count{font-size:24px}.cards{grid-template-columns:1fr}.calendar{display:none}.mobile-list{display:block}.mobile-date{margin:16px 0 7px;font-size:13px;color:var(--sub)}.mobile-list .lesson{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:14px}.mobile-list .tag{justify-self:start}.toolbar h2{width:100%}.toolbar button{flex:1}.toolbar #generate,.toolbar #publish{flex:1 1 40%}.form-grid{grid-template-columns:1fr}.panel{inset:10px;width:auto;max-width:none;padding:18px}dialog{padding:20px}.slots{grid-template-columns:repeat(2,1fr)}.demo{font-size:12px;margin-bottom:20px}}

<body>
<div class="shell"><aside><div class="brand">課序<small>讓每一堂課，有條不紊。</small></div><nav class="nav" aria-label="主要導覽"><button data-nav="home">首頁</button><button data-nav="students">學生</button></nav><div class="aside-bottom"><button id="settings">設定・可排課時間</button><button id="guide">展示導覽</button><button id="reset">重設展示資料</button><small>單檔 Web App<br>Vibe Coding 作業</small></div></aside><main><header><div><small id="eyebrow">TEACHER WORKSPACE</small><h1 id="title">課程總覽</h1></div><div class="role" aria-label="角色展示切換"><button id="teacher" aria-pressed="true">老師端</button><button id="parent" aria-pressed="false">家長端</button><select id="parent-student" aria-label="選擇展示家長" hidden></select></div></header><div class="demo"><b>作業展示版</b> · 全部為虛構資料，操作僅儲存在此瀏覽器。角色切換為模擬，請勿輸入真實個資。</div><div id="content"></div><footer>課序 · Warm Structured Workspace<br>獨立前端展示，未連接正式 MVP、D1 或外部服務。<a href="https://github.com/wqii77/tutor-schedule-demo/blob/main/SPEC.md" target="_blank" rel="noopener">閱讀規格書 ↗</a></footer></main></div>
<section id="panel" class="panel" hidden aria-label="待辦側欄"></section><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='chixu-assignment-v1',WEEK=['日','一','二','三','四','五','六'],pad=n=>String(n).padStart(2,'0'),time=n=>`${pad(Math.floor(n/60))}:${pad(n%60)}`,minutes=v=>{const [h,m]=v.split(':').map(Number);return h*60+m},monthDays=m=>{const [y,n]=m.split('-').map(Number);return Array.from({length:new Date(Date.UTC(y,n,0)).getUTCDate()},(_,i)=>`${m}-${pad(i+1)}`)},weekday=d=>new Date(d+'T12:00:00Z').getUTCDay(),fmt=l=>`${l.date} ${time(l.start)}–${time(l.start+l.duration)}`;
// 展示時鐘固定於 2026-11-01，不受實際上課日期影響。
const DEMO_TODAY='2026-11-01';
function seed(){const students=[{id:'s1',name:'小禾（虛構）',day:1,start:1080,duration:90,rate:800,location:'示範地點 A'},{id:'s2',name:'小晴（虛構）',day:3,start:1140,duration:90,rate:900,location:'示範地點 B'},{id:'s3',name:'小宇（虛構）',day:6,start:600,duration:120,rate:850,location:'線上教室（示範）'}];let lessons=[];for(const s of students)for(const date of monthDays('2026-11').filter(d=>weekday(d)===s.day))lessons.push({id:s.id+date,student:s.id,date,start:s.start,duration:s.duration,rate:s.rate,originDate:date,originStart:s.start,month:'2026-11',published:true,status:'confirmed',history:['依固定規則建立並完成確認（示範）']});const one=(s,d)=>lessons.find(l=>l.student===s&&l.date===d);Object.assign(one('s1','2026-11-09'),{status:'discussion',resumeStatus:'confirmed',proposal:{date:'2026-11-10',start:1080,by:'parent'},history:['原課程已確認','家長提出 11/10 18:00 候選，等待老師確認（示範）']});Object.assign(one('s2','2026-11-11'),{status:'leave',history:['原課程已確認','家長提出請假（示範）']});Object.assign(one('s3','2026-11-14'),{status:'pending'});Object.assign(one('s2','2026-11-18'),{status:'discussion',resumeStatus:'confirmed',proposal:{date:'2026-11-19',start:1140,by:'teacher'},history:['老師提出 11/19 19:00 新時間，等待家長回覆（示範）']});Object.assign(one('s1','2026-11-30'),{published:false,status:'pending'});return {students,lessons,commute:30,manual:true,blocks:[{id:'b1',date:'2026-11-15',start:840,end:960,buffer:30,label:'私人行程（虛構）'}]}}
let state;try{state=JSON.parse(localStorage.getItem(KEY));if(!state||!Array.isArray(state.lessons)||!Array.isArray(state.students)||!Array.isArray(state.blocks))state=seed()}catch{state=seed()}
let role='teacher',page='home',parentId=state.students[0]?.id,month='2026-11',panelType='',panelStudent='',trigger=null,panelTrigger=null,timer;
const student=l=>state.students.find(s=>s.id===l.student),visible=()=>state.lessons.filter(l=>l.date.slice(0,7)===month&&(role==='teacher'||l.student===parentId&&l.published)),actor=()=>role==='teacher'?'老師':'家長';
function label(l){if(!l.published)return '未發布';return ({pending:l.date!==l.originDate||l.start!==l.originStart?'時間異動':'待確認',confirmed:l.date!==l.originDate||l.start!==l.originStart?'時間異動':'已確認',discussion:'排課討論中',leave:'請假待確認',cancelled:'已取消'})[l.status]}
function cls(l){return !l.published?'draft':l.status==='confirmed'&&(l.date!==l.originDate||l.start!==l.originStart)?'changed':l.status}
function tell(msg){$('#toast').textContent=msg;clearTimeout(timer);timer=setTimeout(()=>$('#toast').textContent='',4500)}
function persist(msg){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{tell('瀏覽器無法保存；本次操作只保留到關閉網頁。')}render();if(panelType)renderPanel();if(msg)tell(msg)}
function lessonButton(l){return `<button class="lesson ${cls(l)}" data-lesson="${esc(l.id)}" aria-label="${esc(student(l)?.name)}，${esc(fmt(l))}，${label(l)}"><strong>${esc(student(l)?.name)}</strong><time>${time(l.start)}–${time(l.start+l.duration)}</time>${label(l)!=='已確認'?`<span class="tag">${label(l)}</span>`:''}</button>`}
function render(){const isParent=role==='parent';$('#teacher').setAttribute('aria-pressed',!isParent);$('#parent').setAttribute('aria-pressed',isParent);$('#parent-student').hidden=!isParent;$('#parent-student').innerHTML=state.students.map(s=>`<option value="${esc(s.id)}" ${s.id===parentId?'selected':''}>${esc(s.name)}的家長</option>`).join('');$('#settings').hidden=isParent;document.querySelectorAll('[data-nav]').forEach(b=>{b.hidden=isParent&&b.dataset.nav==='students';if(b.dataset.nav===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#eyebrow').textContent=isParent?'PARENT PREVIEW · 模擬角色':'TEACHER WORKSPACE';$('#title').textContent=isParent?'孩子的課表':page==='students'?'學生資料':'課程總覽';if(page==='students'&&!isParent){renderStudents();return}const ls=visible(),effective=ls.filter(l=>l.status!=='cancelled'),hours=effective.reduce((a,l)=>a+l.duration/60,0),fee=effective.reduce((a,l)=>a+l.duration/60*l.rate,0);const discussions=state.lessons.filter(l=>l.status==='discussion'&&(role==='teacher'||l.student===parentId&&l.published)),leaves=state.lessons.filter(l=>l.status==='leave'&&(role==='teacher'||l.student===parentId&&l.published));let body=`<div class="metrics"><div class="metric"><small>本月有效課程</small><strong>${effective.length}<small> 堂</small></strong></div><div class="metric"><small>安排時數</small><strong>${hours}<small> 小時</small></strong></div><div class="metric"><small>預估學費</small><strong><small>NT$ </small>${fee.toLocaleString()}</strong></div></div>`;body+=`<div class="summary"><button data-panel="discussion"><span><strong>排課討論</strong><small>${role==='teacher'?discussions.filter(l=>responsible(l)==='teacher').length+' 件需要我處理':'協調新時間，雙方確認'}</small></span><span class="count">${discussions.length} →</span></button><button data-panel="leave"><span><strong>請假確認</strong><small>${role==='teacher'?'先處理請假，再進入調課':'等待老師決定'}</small></span><span class="count">${leaves.length} →</span></button></div>`;body+=`<div class="toolbar"><h2>${month.slice(0,4)} 年 ${Number(month.slice(5))} 月</h2><button data-month="-1" aria-label="上一個月">←</button><button data-month="1" aria-label="下一個月">→</button><button id="demo-month">展示月份</button>${!isParent?'<button id="generate">建立月份草稿</button><button id="publish" class="primary">發布草稿</button>':''}</div><div class="legend">${['已確認','待確認','排課討論中','請假待確認','時間異動','未發布','已取消'].map(t=>`<span>${t} ${ls.filter(l=>label(l)===t).length}</span>`).join('')}</div>`;const dates=monthDays(month),cells=[...Array(weekday(dates[0])).fill(null),...dates];while(cells.length%7)cells.push(null);body+=`<div class="calendar" aria-label="${month}月曆"><div class="week">${WEEK.map(w=>`<div>星期${w}</div>`).join('')}</div><div class="grid">${cells.map(d=>`<div class="day ${d?'':'blank'}">${d?`<span class="date">${Number(d.slice(8))}</span>${ls.filter(l=>l.date===d).sort((a,b)=>a.start-b.start).map(lessonButton).join('')}${role==='teacher'?state.blocks.filter(b=>b.date===d).map(b=>`<small>不可排課 ${time(b.start)}–${time(b.end)}</small>`).join(''):''}`:''}</div>`).join('')}</div></div>`;body+=`<div class="mobile-list">${dates.filter(d=>ls.some(l=>l.date===d)).map(d=>`<p class="mobile-date">${d}（${WEEK[weekday(d)]}）</p>${ls.filter(l=>l.date===d).sort((a,b)=>a.start-b.start).map(lessonButton).join('')}`).join('')||'<div class="empty">本月尚無課程。</div>'}</div><p class="help">點課程查看詳情與操作。${isParent?'此視角只顯示選定學生的已發布課程。':'通勤緩衝 '+state.commute+' 分鐘 · 暫時保留的候選與原時段都會阻擋其他排課。'}</p>`;$('#content').innerHTML=body}
function responsible(l){return l.proposal?(l.proposal.by==='parent'?'teacher':'parent'):l.awaiting||'parent'}
function renderStudents(){$('#content').innerHTML=`<div class="toolbar"><h2>${state.students.length} 位學生</h2><button class="primary" id="add-student">新增示範學生</button></div><div class="cards">${state.students.map(s=>`<article class="card"><span class="tag">固定規則</span><h2>${esc(s.name)}</h2><p>每週${WEEK[s.day]} ${time(s.start)}–${time(s.start+s.duration)}<br>${s.duration/60} 小時 · NT$ ${s.rate}／小時<br>${esc(s.location)}</p><small>既有課程保留建立時的費率與時數。</small><div class="actions"><button data-edit="${esc(s.id)}">編輯規則</button><button data-parent="${esc(s.id)}">展示家長端</button></div></article>`).join('')}</div>`}
function renderPanel(){const el=$('#panel');el.hidden=false;let ls=state.lessons.filter(l=>l.status===panelType&&(role==='teacher'||l.student===parentId&&l.published));const name=panelType==='discussion'?'排課討論':'請假確認';el.innerHTML=`<header><h2>${name}</h2><button id="close-panel" aria-label="關閉待辦側欄">×</button></header>`;if(panelStudent){const st=state.students.find(s=>s.id===panelStudent);el.innerHTML+=`<button id="back-panel">← 返回學生列表</button><h3>${esc(st?.name)}</h3>${ls.filter(l=>l.student===panelStudent).map(l=>`<button class="row" data-lesson="${esc(l.id)}"><span>${esc(fmt(l))}<br><small>${l.proposal?'候選 '+esc(fmt({...l,...l.proposal})):'等待'+(responsible(l)==='teacher'?'老師':'家長')+'處理'}</small></span><span>→</span></button>`).join('')||'<p class="empty">這位學生的案件已處理完成。</p>'}`;return}for(const who of panelType==='discussion'?['teacher','parent']:['teacher']){const group=ls.filter(l=>panelType==='leave'||responsible(l)===who);el.innerHTML+=`<h3>${panelType==='leave'?'待處理申請':who==='teacher'?'需要老師處理':'等待家長回覆'} · ${group.length}</h3>`;el.innerHTML+=state.students.filter(s=>group.some(l=>l.student===s.id)).map(s=>`<button class="row" data-panel-student="${esc(s.id)}"><strong>${esc(s.name)}</strong><span>${group.filter(l=>l.student===s.id).length} 件 →</span></button>`).join('')||'<p class="quiet">目前沒有案件。</p>'}}
function closePanel(){panelType='';panelStudent='';$('#panel').hidden=true;panelTrigger?.focus()}
function openDialog(title,body){trigger=document.activeElement;const d=$('#dialog');d.innerHTML=`<header><h2 id="dialog-title">${title}</h2><button id="close-dialog" aria-label="關閉對話框">×</button></header>${body}<div id="error" class="error" role="alert"></div>`;d.showModal()}
function closeDialog(){$('#dialog').close();if(trigger?.isConnected)trigger.focus();else $('#teacher').focus()}
function confirmAction(title,text,fn){openDialog(title,`<p>${text}</p><div class="actions"><button id="confirm-action" class="primary">確認</button><button id="return">返回</button></div>`);$('#confirm-action').onclick=()=>{try{fn();closeDialog()}catch(e){$('#error').textContent=e.message}}}
function conflict(l,date,start,buffer=state.commute,others=state.lessons){const hits=[];const overlaps=(a,b,c,d)=>a<d&&c<b;for(const x of others){if(x.id===l.id||x.status==='cancelled')continue;if(x.date===date&&overlaps(start,start+l.duration,x.start-buffer,x.start+x.duration+buffer))hits.push(`${student(x)?.name||'課程'} ${time(x.start)}–${time(x.start+x.duration)}（含通勤緩衝 ${buffer} 分鐘）`);if(x.proposal&&x.proposal.date===date&&overlaps(start,start+l.duration,x.proposal.start-buffer,x.proposal.start+x.duration+buffer))hits.push('其他課程的暫時保留時段（Hold）')}for(const b of state.blocks)if(b.date===date&&overlaps(start,start+l.duration,b.start-b.buffer,b.end+b.buffer))hits.push('不可排課時段（含前後緩衝）');return hits}
function validSlot(l,d,t,buffer=state.commute){const open=weekday(d)%6===0?600:1080;return state.manual&&d>=DEMO_TODAY&&Number.isInteger(t)&&t%30===0&&t>=open&&t+l.duration<=1320&&!conflict(l,d,t,buffer).length}
function detail(id){const l=state.lessons.find(l=>l.id===id);if(!l||(role==='parent'&&(l.student!==parentId||!l.published)))return;let b=`<span class="tag">${label(l)}</span><div class="note"><h3>${esc(fmt(l))}</h3><p>${l.duration/60} 小時 · NT$ ${l.rate}／小時</p>${l.date!==l.originDate||l.start!==l.originStart?`<p>原時間：${esc(fmt({...l,date:l.originDate,start:l.originStart}))}</p>`:''}<p>${esc(student(l)?.location)}</p></div>`;if(l.proposal)b+=`<div class="note"><h3>${l.proposal.by==='parent'?'家長':'老師'}提出的候選</h3><p>${esc(fmt({...l,...l.proposal}))}</p><small>候選已暫時保留；原課程時段維持占用，直到雙方確認。</small></div>`;let actions=[];if(l.status!=='cancelled'){if(role==='parent'&&l.status==='pending')actions.push(['confirm','確認上課時間']);if(role==='parent'&&l.status==='confirmed'&&l.date>=DEMO_TODAY)actions.push(['leave','申請請假']);if(l.status==='leave'&&role==='teacher')actions.push(['reschedule','轉為調課'],['cancel','取消課程']);if(['confirmed','pending','discussion'].includes(l.status)&&l.date>=DEMO_TODAY)actions.push(['pick',l.published?'提出／改選時間':'調整草稿時間']);if(l.status==='discussion'){if(l.proposal&&l.proposal.by!==role)actions.push(['accept','接受候選時間'],['reject','拒絕這個候選']);actions.push(['cancelReschedule','取消調課']);}if(role==='teacher'&&l.status!=='leave')actions.push(['cancel','取消課程']);}b+=`<div class="actions">${actions.map(([a,t])=>`<button data-action="${a}" data-id="${esc(id)}" ${a==='accept'||a==='confirm'?'class="primary"':''}>${t}</button>`).join('')}</div><h3 style="margin-top:24px">討論與操作紀錄</h3><ul class="history">${(l.history||[]).map(t=>`<li>${esc(t)}</li>`).join('')||'<li>尚無紀錄</li>'}</ul>`;openDialog(esc(student(l)?.name)+' · 課程詳情',b)}
function apply(id,type){const l=state.lessons.find(l=>l.id===id);if(!l||l.status==='cancelled')throw Error('課程已取消或不存在。');if(role==='parent'&&(l.student!==parentId||!l.published))throw Error('只能操作此展示家長的已發布課程。');let message='';if(type==='confirm'){if(role!=='parent'||l.status!=='pending')throw Error('請由家長確認待確認課程。');l.status='confirmed';message='家長確認上課時間'}else if(type==='leave'){if(role!=='parent'||l.status!=='confirmed'||l.date<DEMO_TODAY)throw Error('只有未結束的已確認課程可請假。');l.status='leave';message='家長提出請假申請'}else if(type==='reschedule'){if(role!=='teacher'||l.status!=='leave')throw Error('請由老師處理請假。');l.resumeStatus='leave';l.status='discussion';l.awaiting='parent';message='老師將請假轉為調課，等待家長選時'}else if(type==='cancel'){if(role!=='teacher')throw Error('請由老師取消課程。');l.status='cancelled';delete l.proposal;delete l.resumeStatus;delete l.awaiting;message='老師取消課程，釋放時段，不計入時數與學費'}else if(type==='cancelReschedule'){if(l.status!=='discussion'||!['confirmed','pending','leave'].includes(l.resumeStatus))throw Error('無法安全判斷調課前狀態，資料維持不變。');l.status=l.resumeStatus;delete l.proposal;delete l.resumeStatus;delete l.awaiting;message='取消調課，還原原狀態並釋放 Hold'}else if(type==='accept'||type==='reject'){if(l.status!=='discussion'||!l.proposal||l.proposal.by===role)throw Error('只能回覆對方提出的候選。');if(type==='accept'){if(!validSlot(l,l.proposal.date,l.proposal.start,0))throw Error('時段已不可用，請重新選時。');l.date=l.proposal.date;l.start=l.proposal.start;l.status='confirmed';delete l.resumeStatus;delete l.awaiting;message='雙方接受新時間，課程已確認'}else{l.awaiting=l.proposal.by;message='拒絕候選，釋放 Hold；排課討論繼續'}delete l.proposal;}else throw Error('不支援的操作');l.history.push(message);persist(message)}
function picker(id){const l=state.lessons.find(l=>l.id===id);closeDialog();openDialog(l.published?'選擇調課候選':'調整未發布草稿',`<p>原安排：${esc(fmt(l))}</p><small>時數固定 ${l.duration/60} 小時；平日 18:00–22:00，週末 10:00–22:00。通勤 ${state.commute} 分鐘。</small><label for="pick-date">候選日期（展示時鐘：2026/11/01）</label><input id="pick-date" type="date" min="${DEMO_TODAY}" value="${l.date}"><div id="slots" class="slots"></div><label for="pick-note">調課註記（勿輸入真實個資）</label><textarea id="pick-note" maxlength="500" placeholder="例如：學校活動，想改到週末"></textarea><div id="selection" class="note">請選擇日期與時間。尚未建立 Hold。</div><button id="send-proposal" class="primary" disabled>${l.published?'確認送出候選':'儲存草稿時間'}</button>`);let selected=null;const refresh=()=>{selected=null;$('#send-proposal').disabled=true;$('#selection').textContent='選取尚未占用時段；送出後才會保留。';const d=$('#pick-date').value;let html='';if(d){for(let t=weekday(d)%6===0?600:1080;t+l.duration<=1320;t+=30){const same=d===l.date&&t===l.start,ok=validSlot(l,d,t)&&!same;html+=`<button data-slot="${t}" aria-pressed="false" ${ok?'':'disabled'} title="${same?'與原時段相同':ok?'可選':'不可排課、課程或通勤緩衝阻擋'}">${time(t)}–${time(t+l.duration)}</button>`}}$('#slots').innerHTML=html||'<p>請選擇日期。</p>'};$('#pick-date').onchange=refresh;$('#slots').onclick=e=>{const b=e.target.closest('[data-slot]');if(!b||b.disabled)return;selected=Number(b.dataset.slot);$('#slots').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#send-proposal').disabled=false;$('#selection').textContent=`原：${fmt(l)} → 新：${$('#pick-date').value} ${time(selected)}–${time(selected+l.duration)}`};$('#send-proposal').onclick=()=>{const d=$('#pick-date').value;if(selected===null||!validSlot(l,d,selected)||d===l.date&&selected===l.start){$('#error').textContent='時段不可用，請重新選擇。';refresh();return}const note=$('#pick-note').value.trim();if(!l.published){l.date=d;l.start=selected;l.history.push('老師調整未發布草稿 '+fmt(l));}else{if(l.status!=='discussion')l.resumeStatus=l.status;l.status='discussion';l.proposal={date:d,start:selected,by:role};delete l.awaiting;l.history.push((role==='teacher'?'老師':'家長')+'提出候選 '+fmt({...l,...l.proposal})+(note?' · '+note:''));}persist(l.published?'候選已送出並建立 Hold，等待對方確認。':'草稿已儲存，尚未發布。');closeDialog()};refresh()}
function studentForm(id){const s=state.students.find(x=>x.id===id)||{name:'',day:2,start:1080,duration:90,rate:800,location:''};openDialog(id?'編輯固定規則':'新增示範學生',`<form id="student-form"><label for="name">學生名稱（請用虛構名稱）</label><input id="name" required maxlength="80" value="${esc(s.name)}"><div class="form-grid"><label>固定星期<select id="day">${WEEK.map((w,i)=>`<option value="${i}" ${s.day===i?'selected':''}>星期${w}</option>`).join('')}</select></label><label>開始時間<input id="start" type="time" step="1800" required value="${time(s.start)}"></label><label>時數<select id="duration">${[60,90,120,150,180].map(n=>`<option value="${n}" ${s.duration===n?'selected':''}>${n/60} 小時</option>`).join('')}</select></label><label>時薪（NT$）<input id="rate" type="number" min="0" max="100000" required value="${s.rate}"></label></div><label>示範地點<input id="location" maxlength="100" required value="${esc(s.location)}"></label><p class="help">規則變更只影響新產生的課程；不覆蓋既有快照。</p><button class="primary" style="margin-top:18px">儲存規則</button></form>`);$('#student-form').onsubmit=e=>{e.preventDefault();const start=minutes($('#start').value),duration=Number($('#duration').value);if(start%30||start+duration>1440){$('#error').textContent='請使用半小時刻度，且課程不能跨日。';return}const v={id:id||'s'+Date.now(),name:$('#name').value.trim(),day:Number($('#day').value),start,duration,rate:Number($('#rate').value),location:$('#location').value.trim()};if(!v.name||!v.location){$('#error').textContent='請填寫名稱與地點。';return}if(id)Object.assign(s,v);else state.students.push(v);persist('學生固定規則已保存。');closeDialog()}}
function generate(){const additions=[];for(const s of state.students)for(const d of monthDays(month).filter(d=>weekday(d)===s.day)){if(state.lessons.some(l=>l.student===s.id&&l.month===month&&l.originDate===d))continue;const l={id:s.id+d,student:s.id,date:d,start:s.start,duration:s.duration,rate:s.rate,originDate:d,originStart:s.start,month,published:false,status:'pending',history:['依固定規則建立課程草稿']};const hits=conflict(l,d,l.start,state.commute,[...state.lessons,...additions]);if(hits.length)throw Error(`${fmt(l)} 與 ${hits.join('、')} 衝突；本次沒有建立任何課程。`);additions.push(l)}if(!additions.length)throw Error('本月已有全部固定課程，未覆蓋既有快照。');state.lessons.push(...additions);persist(`已建立 ${additions.length} 堂草稿，尚未發布。`)}
function settings(){openDialog('設定 · 可排課時間',`<form id="settings-form"><label>通勤緩衝（分鐘，0–240）<input id="commute" type="number" min="0" max="240" step="1" required value="${state.commute}"></label><label>人工開放選時<select id="manual"><option value="true" ${state.manual?'selected':''}>開啟</option><option value="false" ${!state.manual?'selected':''}>關閉</option></select></label><p class="help">預設 30 分鐘，只影響新候選與新草稿；發布與確認既有候選只檢查直接重疊。</p><button class="primary" style="margin-top:16px">確認儲存設定</button></form><h3 style="margin-top:24px">不可排課時段</h3><div class="list">${state.blocks.map(b=>`<div class="row"><span>${esc(b.label)}<br><small>${b.date} ${time(b.start)}–${time(b.end)}<br>前後各 ${b.buffer} 分鐘</small></span><button data-remove-block="${esc(b.id)}">移除</button></div>`).join('')||'<p class="quiet">尚無時段</p>'}</div><button id="add-block" style="margin-top:14px">新增不可排課</button>`);$('#settings-form').onsubmit=e=>{e.preventDefault();const n=Number($('#commute').value);if(!Number.isInteger(n)||n<0||n>240){$('#error').textContent='請填寫 0–240 的整數。';return}state.commute=n;state.manual=$('#manual').value==='true';persist('通勤與人工選時設定已保存。');closeDialog()}}
function blockForm(){closeDialog();openDialog('新增不可排課',`<form id="block-form"><label>日期<input id="block-date" type="date" required value="2026-11-22"></label><div class="form-grid"><label>開始<input id="block-start" type="time" required value="14:00"></label><label>結束<input id="block-end" type="time" required value="16:00"></label></div><label>前後緩衝（分鐘）<input id="block-buffer" type="number" min="30" max="360" step="1" required value="30"></label><label>原因（只在老師展示視角顯示）<input id="block-label" required maxlength="100" value="示範私人行程"></label><button class="primary" style="margin-top:18px">新增時段</button></form>`);$('#block-form').onsubmit=e=>{e.preventDefault();const start=minutes($('#block-start').value),end=minutes($('#block-end').value),buffer=Number($('#block-buffer').value),date=$('#block-date').value;if(end<=start||!Number.isInteger(buffer)){ $('#error').textContent='結束時間須晚於開始時間，緩衝須為整數。';return}const overlaps=(a,b,c,d)=>a<d&&c<b;const hit=state.lessons.some(l=>l.status!=='cancelled'&&(l.date===date&&overlaps(start-buffer,end+buffer,l.start,l.start+l.duration)||l.proposal?.date===date&&overlaps(start-buffer,end+buffer,l.proposal.start,l.proposal.start+l.duration)));if(hit){$('#error').textContent='含緩衝的不可排課時段與課程或 Hold 重疊，未新增。';return}state.blocks.push({id:'b'+Date.now(),date,start,end,buffer,label:$('#block-label').value.trim()});persist('不可排課時段已新增。');closeDialog()}}
function guide(){openDialog('3 分鐘體驗課序',`<ol class="history"><li>老師端：點「排課討論」→ 小禾 → 11/09 課程，接受家長 11/10 的候選。</li><li>點「請假確認」→ 小晴 → 轉為調課。案件會移至排課討論。</li><li>切換家長端並選小晴，找到 11/11 課程，提出候選，再切回老師確認。</li><li>學生頁可編輯固定規則；切換 12 月，建立草稿 → 發布 → 家長確認。</li><li>設定通勤 30 或 0，觀察候選可選時段變化。週六小宇 12:00 下課，30 分鐘緩衝下，其他學生最早 12:30 才能接課。</li></ol><div class="note">固定展示時鐘為 2026/11/01，可隨時用「重設展示資料」重新體驗。這會清除本瀏覽器的展示操作。</div>`)}
$('#dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dialog').open&&panelType)closePanel()});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav){page=d.nav;closePanel();render()}else if(d.lesson){detail(d.lesson)}else if(d.panel){panelTrigger=b;panelType=d.panel;panelStudent='';renderPanel();$('#close-panel').focus()}else if(d.panelStudent){panelStudent=d.panelStudent;renderPanel();$('#back-panel').focus()}else if(d.month){const [y,m]=month.split('-').map(Number);const date=new Date(Date.UTC(y,m-1+Number(d.month),1));month=date.toISOString().slice(0,7);render()}else if(d.edit!==undefined){studentForm(d.edit)}else if(d.parent){parentId=d.parent;switchRole('parent')}else if(d.action){const id=d.id,type=d.action;if(type==='pick'){picker(id);return}closeDialog();const prompts={confirm:['確認課程？','確認目前的上課時間。'],leave:['提出請假？','原時段仍保留，等待老師處理。'],reschedule:['將請假轉為調課？','此案件會離開請假確認，移至排課討論。'],cancel:['取消課程？','將釋放原時段與 Hold，並從有效時數及學費排除。'],accept:['接受候選時間？','雙方確認後才更改課程時間，並釋放原時段。'],reject:['拒絕這個候選？','只釋放此候選；排課討論繼續，等待對方重新提出。'],cancelReschedule:['取消調課？','釋放候選 Hold，保留原時間，還原進入調課前的狀態。']};confirmAction(...prompts[type],()=>apply(id,type))}else if(d.removeBlock){state.blocks=state.blocks.filter(x=>x.id!==d.removeBlock);persist('已移除不可排課。');closeDialog();settings()}else switch(b.id){case 'close-dialog':case 'return':closeDialog();break;case 'close-panel':closePanel();break;case 'back-panel':panelStudent='';renderPanel();$('#close-panel').focus();break;case 'teacher':switchRole('teacher');break;case 'parent':switchRole('parent');break;case 'settings':settings();break;case 'guide':guide();break;case 'add-student':studentForm();break;case 'add-block':blockForm();break;case 'demo-month':month='2026-11';render();break;case 'generate':confirmAction('建立月份草稿？',`依目前固定規則建立 ${month} 課程；有衝突時整批拒絕，不覆蓋既有快照。`,generate);break;case 'publish':confirmAction('發布月份草稿？','家長展示視角將可以看到這些課程，並進行確認。',()=>{const ls=state.lessons.filter(l=>l.month===month&&!l.published&&l.status!=='cancelled');if(!ls.length)throw Error('本月沒有待發布草稿。');for(const l of ls)if(conflict(l,l.date,l.start,0).length)throw Error('課表或 Hold 存在直接重疊，未發布。');ls.forEach(l=>{l.published=true;l.history.push('老師發布，等待家長確認')});persist('課表已發布，等待家長確認。')});break;case 'reset':confirmAction('重設展示資料？','只清除本瀏覽器的展示操作，回到初始虛構資料。',()=>{state=seed();parentId='s1';role='teacher';page='home';month='2026-11';closePanel();persist('已重設展示資料。')});break;}});
function switchRole(next){role=next;page='home';closePanel();render()}
$('#parent-student').onchange=e=>{parentId=e.target.value;closePanel();render()};render();
</script></body></html>
